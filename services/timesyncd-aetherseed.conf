# AetherSeed Companion - the clock is set from the network when there is one.
# Installed at /etc/systemd/timesyncd.conf.d/aetherseed.conf by install.sh.
#
# 21 Nov 2026, the operator: "sync the clocks through the network on
# connection now, so the clock problem is resolved for good". Until then the
# clock asked nobody, and a unit that had been off ran behind by as long as
# it was off (one unit was found three days behind).
#
# systemd-timesyncd asks the public NTP pool as soon as the unit has a
# network, and again from time to time. The firewall (services/nftables.conf)
# lets its own user, systemd-timesync, and nobody else, look up the pool's
# names and ask for the time. Without a network it still saves the time to
# disk every minute and, at start, puts the clock forward to the last time
# saved, so an unplugged unit resumes from when it stopped.
#
# What this costs, stated because it is real: plain NTP is not
# authenticated, so someone on the network path could set the clock wrong.
# The answers never carry anything of the unit's out.
[Time]
NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
FallbackNTP=
SaveIntervalSec=60
